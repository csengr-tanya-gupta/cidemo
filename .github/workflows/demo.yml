name: GitHub Secrets Demonstration

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches:
      - main # Runs automatically on push to main branch

jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Demo Script with Secret
        env:
          MY_SECRET_TOKEN: ${{ secrets.MY_SECRET_TOKEN }}
        run: python secrets_demo.py
